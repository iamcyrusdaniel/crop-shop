<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="styles.css" rel="stylesheet">
        <title>Crop Shop</title>
    </head>
    <body>
        <audio id="backgroundMusic" src="../assets/music/thePriceIsRight.mp3" loop></audio>
        <header>
            <div class="game-menu">
                <a class="menu-title" href="../home">crop shop</a>
            </div>
        </header>
        <button id="musicButton">music</button>
        <button class="level-selector-toggle" onmousedown="openLevelSelector()"><svg xmlns="http://www.w3.org/2000/svg" height="80%" viewBox="0 0 24 24" width="80%" fill="#5c3b19"><path d="M0 0h24v24H0z" fill="none"/><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg></button>
        <h1 id="levelText">Level 1</h1>
        <div class="level-selection-holder hidden">
            <h1 style="padding-bottom: 0.5vw; font-size: 4vw;">choose a level!</h1>
            <button class="close-level-selector">X</button>
            <div class="level-selection">
                <button class="level-option">1</button>
                <button class="level-option">2</button>
                <button class="level-option">3</button>
                <button class="level-option">4</button>
                <button class="level-option">5</button>
                <button class="level-option">6</button>
                <button class="level-option">7</button>
                <button class="level-option">8</button>
                <button class="level-option">9</button>
                <button class="level-option">10</button>
            </div>
        </div>
        <div class="playing-area">
            <div class="placement-grid">
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
            </div>
            <div class="background">
                
                <button id="submit">submit</button>
            </div>
        </div>
            
        <div id="crops">
            <!-- <button id="close-background"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="m480-321 137-137q20-20 48-20t47 20q20 20 20 47.5T712-363L528-178q-9 9-22 14.5t-26 5.5q-13 0-26-5.5T432-178L248-363q-20-20-19.5-48t19.5-47q20-20 48-20t47 20l137 137Zm0-299 137-137q20-20 48-20t47 21q20 20 20 47.5T712-661L528-477q-9 9-22 14.5t-26 5.5q-13 0-26-5.5T432-477L248-661q-20-20-19.5-47.5T248-756q20-21 48-21t48 21l136 136Z"/></svg></button> -->
        </div>

        <div id="mouse-selector"></div>

        <script src="main.js"></script>
    </body>
</html>
