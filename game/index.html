<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Crop Shop</title>
    </head>
    <body>
        <audio id="backgroundMusic" src="../assets/music/thePriceIsRight.mp3" loop></audio>
        <header>
            <div class="game-menu">
                <div>
                    <button id="musicButton"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M580-86v-109q97-28 157.5-107T798-481q0-100-61-179T580-767v-109q142 29 232.5 139.5T903-481q0 144-90.5 255.5T580-86ZM57-318v-324h185l258-258v840L242-318H57Zm523 15v-355q53 26 86 73t33 105q0 58-33 105t-86 72Z"/></svg></button>
                    <a class="menu-title" href="../home">crop shop</a>
                    <h1 id="levelText">Level 1</h1>
                </div>
                <div>
                    <button class="level-selector-toggle" onmousedown="openLevelSelector()"><svg xmlns="http://www.w3.org/2000/svg" height="70%" viewBox="0 0 24 24" width="70%" fill="#5c3b19"><path d="M0 0h24v24H0z" fill="none"/><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg></button>
                </div>
            </div>
        </header>
        <div id="winScreen" class="hidden">
            <h1>you won!</h1>
            <div>
                <button id="retryButton"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M476-113q-152 0-259.5-107T109-479q0-152 107.5-260T476-847q78.29 0 148.15 31.5Q694-784 745-726v-121h106v350H500v-105h170q-33-50-83.82-78.5Q535.37-709 476-709q-96 0-163.5 66.92Q245-575.17 245-479q0 96.33 67.5 163.17Q380-249 476.34-249q70.72 0 129.69-41T691-398h141q-30 124-129 204.5T476-113Z"/></svg></button>
                <button id="nextButton"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M275-124v-712l561 356-561 356Z"/></svg></button>
            </div>
        </div>
        <div class="level-selection-holder hidden">
            <h1 style="padding-bottom: 2vw; font-size: 4vw;">choose a level!</h1>
            <button class="close-level-selector">&times;</button>
            <div class="level-selection">
                <button class="level-option">1</button>
                <button class="level-option">2</button>
                <button class="level-option">3</button>
                <button class="level-option">4</button>
                <button class="level-option">5</button>
                <button class="level-option">6</button>
                <button class="level-option">7</button>
                <button class="level-option">8</button>
                <button class="level-option">9</button>
                <button class="level-option">10</button>
            </div>
        </div>
        <div class="playing-area">
            <div class="placement-grid">
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
            </div>
            <button id="submit">submit</button>
            <!-- <div class="background">
            </div> -->
        </div>
            
        <div id="crops"></div>

        <div id="mouse-selector"></div>

        <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
        <script src="main.js"></script>
    </body>
</html>
